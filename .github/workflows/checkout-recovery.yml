name: Checkout recovery checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate Flame local manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('flame.xml').getroot()
          projects = root.findall('project')
          remotes = {remote.get('name') for remote in root.findall('remote')}
          assert len(projects) == 5
          assert len({project.get('path') for project in projects}) == len(projects)
          assert len({project.get('name') for project in projects}) == len(projects)
          for project in projects:
              assert project.get('remote') in remotes
              assert project.get('revision')
              assert 'plugin' not in project.get('name')
          print('Five unique source projects with explicit revisions; no standalone plugins.')
          PY
      - name: Verify recovery preserves source edits and outputs
        run: python3 -m unittest discover -s tests -p 'test_restore_checkout.py'
      - name: Check build helper and documented Bash syntax
        run: |
          bash -n apply-build-fixes.sh
          bash -n build-gcam.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          for block in re.findall(r"\x60\x60\x60bash\n(.*?)\n\x60\x60\x60", Path("README.md").read_text() + "\n" + Path("docs/GCAM_EXPERIMENTAL.md").read_text(), re.S):
              subprocess.run(["bash", "-n"], input=block, text=True, check=True)
          PY
